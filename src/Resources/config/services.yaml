services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\OutboundUrlGuardBundle\Dns\HostnameDnsLookup:
        arguments:
            $timeoutSeconds: '%nowo_outbound_url_guard.dns_timeout%'
            $phpBinary: '%nowo_outbound_url_guard.php_binary%'

    Nowo\OutboundUrlGuardBundle\Guard\OutboundUrlGuard:
        public: true
        arguments:
            $allowPrivate: '%nowo_outbound_url_guard.allow_private%'
            $resolveDns: '%nowo_outbound_url_guard.resolve_dns%'
